name: Build Aviator APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AviatorAIScanner-Android-Source-v2.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q AviatorAIScanner-Android-Source-v2.zip
          test -f AviatorAIScanner/app/build.gradle.kts

      - name: Build APK
        working-directory: AviatorAIScanner
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AviatorAIScanner-APK
          path: AviatorAIScanner/app/build/outputs/apk/debug/app-debug.apk
